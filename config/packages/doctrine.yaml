doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        types:
            partner_id: Phprise\KoenmaID\Doctrine\Type\PartnerIdType
            project_id: Phprise\KoenmaID\Doctrine\Type\ProjectIdType
            api_key_id: Phprise\KoenmaID\Doctrine\Type\ApiKeyIdType
            contractor_id: Phprise\KoenmaID\Doctrine\Type\ContractorIdType
            user_id: Phprise\KoenmaID\Doctrine\Type\UserIdType
            refresh_token_id: Phprise\KoenmaID\Doctrine\Type\RefreshTokenIdType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'Phprise\KoenmaID\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
