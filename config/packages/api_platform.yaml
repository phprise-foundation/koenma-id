api_platform:
    title: Koenma ID API
    version: 1.0.0
    formats:
        jsonld:
            mime_types:
                - application/ld+json
        json:
            mime_types:
                - application/json
        xml:
            mime_types:
                - application/xml
                - text/xml
        csv:
            mime_types:
                - text/csv
    patch_formats:
        json:
            mime_types:
                - application/merge-patch+json
                - application/json
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
